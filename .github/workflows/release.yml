name: Release

# Uma tag vX.Y.Z vira uma release: compila no GitHub (MSVC, com Control Flow Guard),
# testa, confere as proteções, gera a atestação de origem e cria a release como
# RASCUNHO. A chave que assina as atualizações não fica no GitHub: baixe o .exe do
# rascunho, assine (`cargo run --example assinar -- X.Y.Z dontStayAlone.exe`), anexe o
# .sig (`gh release upload vX.Y.Z dontStayAlone.exe.sig`) e só então publique. Sem o
# .sig, o app recusa a atualização.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # criar a release
  id-token: write      # atestação de origem (Sigstore)
  attestations: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Rust (MSVC)
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup default 1.98.1  # a mesma de tools/release.ps1

      - name: Versão da tag, do Cargo.toml e notas
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $cargo) { throw "a tag v$tag não bate com o Cargo.toml ($cargo)" }
          if (-not (Test-Path "docs/releases/v$tag.md")) { throw "faltam as notas em docs/releases/v$tag.md" }
          "VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Testes
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Proteções do executável
        shell: pwsh
        run: .github/scripts/check-exe.ps1 -Exe target/release/dontStayAlone.exe -Version $env:VERSION

      - name: Atestação de origem
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/release/dontStayAlone.exe

      - name: Publicar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" target/release/dontStayAlone.exe `
            --title "!StayAlone $env:VERSION" `
            --notes-file "docs/releases/v$env:VERSION.md" `
            --draft
