name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust (MSVC)
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Testes
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Proteções do executável
        shell: pwsh
        run: .github/scripts/check-exe.ps1 -Exe target/release/dontStayAlone.exe

      - uses: actions/upload-artifact@v4
        with:
          name: dontStayAlone-${{ github.sha }}
          path: target/release/dontStayAlone.exe
          retention-days: 14
