[package]
name = "stayalone-chat"
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/4TyllaL/notStayAlone"
description = "Plugin de conversa do !StayAlone: fala com qualquer API compatível com OpenAI (Gemini por padrão)."

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
]
